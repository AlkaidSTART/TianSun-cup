<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 · 牧场智控</title><link rel="stylesheet" href="wechat-ui.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">牧</span><span class="brand-title">牧场智控<span class="brand-sub">· 阿坝示范区</span></span></a><div class="top-actions"><span class="avatar">李</span></div></header><main class="content"><div class="page-head"><div><div class="eyebrow">ACCOUNT & SETTINGS</div><h1>我的</h1><p>管理个人信息、通知与显示偏好</p></div></div><section class="panel"><div style="padding:20px;display:flex;align-items:center;gap:14px"><div class="avatar" style="width:52px;height:52px;font-size:18px">李</div><div style="flex:1"><strong style="font-size:18px">李建国</strong><div style="font-size:12px;color:var(--muted);margin-top:3px">乡镇畜牧技术员 · 阿坝示范区</div></div><span class="status ok">在线</span></div></section><div class="grid-2" style="margin-top:16px"><section class="panel"><div class="panel-head"><div class="panel-title">工作偏好</div><span class="panel-meta">本设备</span></div><div class="list"><button class="list-row setting" data-msg="已切换为深色模式"><span class="icon-disc" style="background:var(--surface);color:var(--fg-2)">◐</span><span class="list-main"><strong>夜间模式</strong><small>冬季 17:00 后降低亮度</small></span><span class="chip" id="themeState">关闭</span></button><button class="list-row setting" data-msg="告警通知已开启"><span class="icon-disc" style="background:color-mix(in oklab,var(--accent) 12%,var(--bg));color:var(--accent)">⌁</span><span class="list-main"><strong>告警通知</strong><small>异常体温、超载与离线提醒</small></span><span class="status ok">已开启</span></button><button class="list-row setting" data-msg="数据刷新频率已更新"><span class="icon-disc" style="background:var(--surface);color:var(--fg-2)">↻</span><span class="list-main"><strong>数据刷新频率</strong><small>地图与列表自动同步</small></span><span class="chip">30 秒</span></button></div></section><section class="panel"><div class="panel-head"><div class="panel-title">示范区信息</div><span class="panel-meta">只读</span></div><div style="padding:4px 18px 14px"><div class="list-row" style="padding-inline:0"><span class="list-main"><strong>四川 · 阿坝县</strong><small>高原放牧示范区</small></span><span class="mono" style="font-size:12px;color:var(--muted)">P-A</span></div><div class="list-row" style="padding-inline:0"><span class="list-main"><strong>当前数据源</strong><small>模拟数据 · 接口预留</small></span><span class="status ok">稳定</span></div><div class="list-row" style="padding-inline:0;border-bottom:0"><span class="list-main"><strong>最近同步</strong><small>2026 / 09 / 07 14:32</small></span><span class="mono" style="font-size:12px;color:var(--muted)">12 秒前</span></div></div></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div class="panel-title">帮助与反馈</div></div><div class="list"><a class="list-row" href="consultation.html"><span class="icon-disc" style="background:color-mix(in oklab,var(--accent) 12%,var(--bg));color:var(--accent)">＋</span><span class="list-main"><strong>在线问诊</strong><small>联系驻场兽医，咨询牲畜健康问题</small></span><span class="status ok">医生在线</span></a><button class="list-row setting" data-msg="帮助中心即将打开"><span class="list-main"><strong>使用帮助</strong><small>查看地图、告警和轮换操作说明</small></span><span style="color:var(--meta)">›</span></button><button class="list-row setting" data-msg="反馈已记录，感谢你的建议"><span class="list-main"><strong>问题反馈</strong><small>告诉我们现场使用中的问题</small></span><span style="color:var(--meta)">›</span></button><button class="list-row setting" data-msg="当前版本 1.0.0"><span class="list-main"><strong>关于牧场智控</strong><small>版本与数据协议</small></span><span class="mono" style="font-size:12px;color:var(--muted)">v1.0.0</span></button></div></section></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span class="nav-ico">⌂</span>总览</a><a class="nav-item" href="alerts.html"><span class="nav-ico">!</span>告警</a><a class="nav-item" href="livestock.html"><span class="nav-ico">◉</span>牲畜</a><a class="nav-item" href="pasture.html"><span class="nav-ico">⌁</span>草场</a><a class="nav-item active" href="profile.html"><span class="nav-ico">⋯</span>我的</a></nav></div><div class="toast" id="toast"></div><script>const toast=document.querySelector('#toast');const msg=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};document.querySelectorAll('.setting').forEach(b=>b.onclick=()=>{if(b.querySelector('#themeState')){const s=b.querySelector('#themeState');s.textContent=s.textContent==='关闭'?'开启':'关闭'}msg(b.dataset.msg)});</script></body></html>
