<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>告警 · 牧场智控</title><link rel="stylesheet" href="wechat-ui.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">牧</span><span class="brand-title">牧场智控<span class="brand-sub">· 阿坝示范区</span></span></a><div class="top-actions"><button class="icon-btn" id="refresh">↻</button><span class="avatar">李</span></div></header><main class="content"><div class="page-head"><div><div class="eyebrow">ALERT CENTER</div><h1>告警</h1><p>需要优先处理的异常与设备状态</p></div><span class="date-chip mono">3 条待处理</span></div><section class="panel"><div class="filter-row"><button class="filter active" data-filter="all">全部 03</button><button class="filter" data-filter="bad">异常 01</button><button class="filter" data-filter="warn">需关注 01</button><button class="filter" data-filter="off">离线 01</button></div><div class="list" id="alertList"><button class="list-row alert-row" data-type="bad" data-id="SC-2026-00286"><span class="icon-disc bad">!</span><span class="list-main"><strong>SC-2026-00286 · 体温偏高</strong><small>40.7℃ · 河谷草场 P-A-03 · 已持续 2 分钟</small></span><span class="list-time">14:30</span></button><button class="list-row alert-row" data-type="warn" data-id="P-A-02"><span class="icon-disc warn">△</span><span class="list-main"><strong>北坡草场 · 载畜压力偏高</strong><small>压力指数 0.94 · 建议明日 06:00 前轮换</small></span><span class="list-time">14:14</span></button><button class="list-row alert-row" data-type="off" data-id="SC-2026-00220"><span class="icon-disc off">⌁</span><span class="list-main"><strong>SC-2026-00220 · 设备离线</strong><small>最后上报 32 分钟前 · 东沟草场 P-A-01</small></span><span class="list-time">14:00</span></button></div></section><div class="grid-2" style="margin-top:16px"><section class="panel"><div class="panel-head"><div><div class="panel-title">处理进度</div><div class="panel-meta">今日告警闭环</div></div><span class="mono">67%</span></div><div style="padding:18px"><div class="stat-value">2<span style="font-size:14px;color:var(--muted);font-family:var(--font-body)"> / 3 已响应</span></div><div class="meter" style="margin-top:14px"><i style="width:67%"></i></div><p style="margin:12px 0 0;color:var(--muted);font-size:12px">异常体温需要现场复核，其余已通知值班人员。</p></div></section><section class="panel"><div class="panel-head"><div class="panel-title">告警规则</div><span class="panel-meta">当前生效</span></div><table class="table"><tbody><tr><td>体温</td><td class="mono">&gt; 40.0℃</td><td><span class="status bad">高优先级</span></td></tr><tr><td>压力指数</td><td class="mono">&gt; 0.80</td><td><span class="status warn">需关注</span></td></tr><tr><td>设备上报</td><td class="mono">&gt; 30 min</td><td><span class="status off">离线</span></td></tr></tbody></table></div></div></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span class="nav-ico">⌂</span>总览</a><a class="nav-item active" href="alerts.html"><span class="nav-ico">!</span>告警</a><a class="nav-item" href="livestock.html"><span class="nav-ico">◉</span>牲畜</a><a class="nav-item" href="pasture.html"><span class="nav-ico">⌁</span>草场</a><a class="nav-item" href="profile.html"><span class="nav-ico">⋯</span>我的</a></nav></div><div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><h2 id="drawerTitle">告警详情</h2><button class="close" id="close">×</button></div><div class="detail-grid" id="drawerBody"></div><div class="drawer-actions"><button class="btn btn-primary" id="locate">定位到地图</button><button class="btn btn-secondary" id="resolve">标记已处理</button></div></div></div><div class="toast" id="toast"></div><script>const toast=document.querySelector('#toast'),drawer=document.querySelector('#drawer');let current='';const msg=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;document.querySelectorAll('.alert-row').forEach(r=>r.style.display=f==='all'||r.dataset.type===f?'flex':'none')});document.querySelectorAll('.alert-row').forEach(r=>r.onclick=()=>{current=r.dataset.id;document.querySelector('#drawerTitle').textContent='告警详情 · '+current;document.querySelector('#drawerBody').innerHTML='<div class="detail"><label>触发对象</label><strong>'+current+'</strong></div><div class="detail"><label>触发时间</label><strong>14:30</strong></div><div class="detail"><label>当前状态</label><strong>'+({"SC-2026-00286":'异常',"P-A-02":'需关注',"SC-2026-00220":'离线'}[current])+'</strong></div><div class="detail"><label>建议动作</label><strong style="font-size:14px">现场复核</strong></div>';drawer.classList.add('open')});document.querySelector('#close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};document.querySelector('#locate').onclick=()=>{drawer.classList.remove('open');msg('已定位 '+current)};document.querySelector('#resolve').onclick=()=>{drawer.classList.remove('open');msg('已标记为处理中')};document.querySelector('#refresh').onclick=()=>msg('告警数据已刷新');</script></body></html>
