span class="list-main"><strong>SC-2026-00342 · 九龙牦牛</strong><small>东沟草场 P-A-01 · 体温 39.2℃ · 心率 62 次/分</small></span><span class="status ok">正常</span></button><button class="list-row animal" data-type="warn" data-id="SC-2026-00107"><span class="icon-disc warn">牛</span><span class="list-main"><strong>SC-2026-00107 · 九龙牦牛</strong><small>东沟草场 P-A-01 · 体温 39.8℃ · 反刍 36 次/天</small></span><span class="status warn">需关注</span></button><button class="list-row animal" data-type="bad" data-id="SC-2026-00286"><span class="icon-disc bad">牛</span><span class="list-main"><strong>SC-2026-00286 · 九龙牦牛</strong><small>河谷草场 P-A-03 · 体温 40.7℃ · 2 分钟前上报</small></span><span class="status bad">异常</span></button><button class="list-row animal" data-type="off" data-id="SC-2026-00220"><span class="icon-disc off">牛</span><span class="list-main"><strong>SC-2026-00220 · 九龙牦牛</strong><small>东沟草场 P-A-01 · 最后上报 32 分钟前</small></span><span class="status off">离线</span></button></div></section></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span class="nav-ico">⌂</span>总览</a><a class="nav-item" href="alerts.html"><span class="nav-ico">!</span>告警</a><a class="nav-item active" href="livestock.html"><span class="nav-ico">◉</span>牲畜</a><a class="nav-item" href="pasture.html"><span class="nav-ico">⌁</span>草场</a><a class="nav-item" href="profile.html"><span class="nav-ico">⋯</span>我的</a></nav></div><div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><h2 id="drawerTitle">牲畜详情</h2><button class="close" id="close">×</button></div><div class="detail-grid" id="drawerBody"></div><div class="drawer-actions"><button class="btn btn-primary" id="locate">定位到地图</button><button class="btn btn-secondary" id="history">查看健康趋势</button></div></div></div><div class="toast" id="toast"></div><script>const toast=document.querySelector('#toast'),drawer=document.querySelector('#drawer');let current='';const msg=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.filter;document.querySelectorAll('.animal').forEach(r=>r.style.display=f==='all'||r.dataset.type===f?'flex':'none')});document.querySelectorAll('.animal').forEach(r=>r.onclick=()=>{current=r.dataset.id;const d={"SC-2026-00342":['正常','39.2℃','2,340','42'],"SC-2026-00107":['需关注','39.8℃','1,860','36'],"SC-2026-00286":['异常','40.7℃','1,120','18'],"SC-2026-00220":['离线','—','—','—']}[current];document.querySelector('#drawerTitle').textContent='牲畜详情 · '+current;document.querySelector('#drawerBody').innerHTML='<div class="detail"><label>健康状态</label><strong>'+d[0]+'</strong></div><div class="detail"><label>体温</label><strong>'+d[1]+'</strong></div><div class="detail"><label>今日步数</label><strong>'+d[2]+'</strong></div><div class="detail"><label>反刍次数</label><strong>'+d[3]+' <small>次/天</small></strong></div><div class="detail"><label>品种</label><strong style="font-size:14px">九龙牦牛</strong></div><div class="detail"><label>所属牧户</label><strong style="font-size:14px">扎西</strong></div>';drawer.classList.add('open')});document.querySelector('#close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};document.querySelector('#locate').onclick=()=>{drawer.classList.remove('open');msg('已在总览地图定位 '+current)};document.querySelector('#history').onclick=()=>msg('健康趋势将在下一版开放');document.querySelector('#refresh').onclick=()=>msg('牲畜数据已刷新');document.querySelector('#export').onclick=()=>msg('列表已准备导出');</script></body></html>
