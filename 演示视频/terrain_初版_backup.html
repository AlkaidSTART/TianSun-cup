<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>川西高原放牧区 | Procedural World</title>
  </head>
  <body>
    <main id="world-root">
      <div id="scene-container"></div>
      <div class="topbar">
        <div>
          <div class="eyebrow">SICHUAN · ABA / GANZI</div>
          <h1>高原放牧区</h1>
        </div>
        <div class="topbar-meta">
          <span class="status-dot"></span>
          <span>程序化地形 · 可自由视角</span>
        </div>
      </div>
      <aside class="info-panel">
        <div class="panel-kicker">LANDSCAPE PROFILE</div>
        <div class="metrics">
          <div><strong>3,000–4,000</strong><span>海拔 / m</span></div>
          <div><strong>100–200</strong><span>相对高差 / m</span></div>
          <div><strong>5°–20°</strong><span>典型坡度</span></div>
        </div>
        <div class="legend">
          <span><i class="swatch meadow"></i>高寒草甸</span>
          <span><i class="swatch soil"></i>裸露土壤</span>
          <span><i class="swatch water"></i>季节性溪流</span>
        </div>
        <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
      </aside>
      <div class="bottom-note">SEED 7319 <span>·</span> HIGHLAND MEADOW SYSTEM</div>
      <div id="loading">正在构建高原地形...</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
